name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write      # create the release
  id-token: write      # Sigstore OIDC token for the provenance attestation
  attestations: write  # store the attestation against this repo

env:
  FLUTTER_VERSION: 3.47.4
  # Not a secret, and deliberately not one: GitHub masks every secret value in
  # the logs, so storing the alias there replaced the word "anipocket" with ***
  # in every line of build output. It must match the alias in the keystore.
  ANDROID_KEY_ALIAS: anipocket

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from the tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -eu
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          NAME="${TAG#v}"
          echo "tag=$TAG"                   >> "$GITHUB_OUTPUT"
          echo "name=$NAME"                 >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $NAME, build $GITHUB_RUN_NUMBER)"

      # Fail here rather than three minutes later, and name what is missing.
      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "${KEYSTORE:-}" ]       || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "${STORE_PASSWORD:-}" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_PASSWORD:-}" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "::error::Create them with tool/make-keystore.sh - see docs/en/development.md#releases"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test before shipping
        run: flutter test

      - name: Decode the release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          printf '%s' "$KEYSTORE" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -eu
          flutter build apk --release --build-name "$VERSION" --build-number "$BUILD"
          flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "$BUILD"

      - name: Collect and name the artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p dist
          src=build/app/outputs/flutter-apk
          cp "$src/app-release.apk"             "dist/anipocket-$VERSION-universal.apk"
          cp "$src/app-arm64-v8a-release.apk"   "dist/anipocket-$VERSION-arm64-v8a.apk"
          cp "$src/app-armeabi-v7a-release.apk" "dist/anipocket-$VERSION-armeabi-v7a.apk"
          cp "$src/app-x86_64-release.apk"      "dist/anipocket-$VERSION-x86_64.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # If the keystore secret had silently failed to apply, Gradle would have
      # fallen back to the debug key and shipped an unpublishable APK. Catch it.
      - name: Verify the APKs carry the release signature
        run: |
          set -eu
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" > /tmp/certs.txt
            cat /tmp/certs.txt
            if grep -qi "CN=Android Debug" /tmp/certs.txt; then
              echo "::error::$apk is signed with the debug key, not the release key"
              exit 1
            fi
          done

      # Binds every artifact to this exact commit, workflow file and runner,
      # signed through Sigstore rather than by a person. A hand-built APK cannot
      # be swapped into the release and still verify:
      #   gh attestation verify <file>.apk -R <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*.apk'

      # Published with the pre-installed gh CLI rather than a third-party action:
      # one less party handling signed artifacts on their way out.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@SHA@|${GITHUB_SHA}|g" \
              -e "s|@REPO@|${GITHUB_REPOSITORY}|g" \
              .github/release-notes.md > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --generate-notes \
            dist/*.apk dist/SHA256SUMS.txt
