name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write      # create the release
  id-token: write      # Sigstore OIDC token for the provenance attestation
  attestations: write  # store the attestation against this repo

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version from the tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${TAG#v}"
          echo "tag=$TAG"                       >> "$GITHUB_OUTPUT"
          echo "name=$NAME"                     >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}"     >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $NAME, build $GITHUB_RUN_NUMBER)"

      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ]       || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "::error::Create them with tool/make-keystore.sh — see docs/en/development.md#releases"
            exit 1
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test before shipping
        run: flutter test

      - name: Decode the release keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.build }}"
          flutter build apk --release --split-per-abi \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "${{ steps.version.outputs.build }}"

      - name: Collect and name the artifacts
        id: artifacts
        run: |
          set -eu
          mkdir -p dist
          V="${{ steps.version.outputs.name }}"
          src=build/app/outputs/flutter-apk
          cp "$src/app-release.apk"             "dist/anipocket-$V-universal.apk"
          cp "$src/app-arm64-v8a-release.apk"   "dist/anipocket-$V-arm64-v8a.apk"
          cp "$src/app-armeabi-v7a-release.apk" "dist/anipocket-$V-armeabi-v7a.apk"
          cp "$src/app-x86_64-release.apk"      "dist/anipocket-$V-x86_64.apk"
          cd dist && sha256sum ./*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify the APKs really are signed with our key
        run: |
          set -eu
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for apk in dist/*.apk; do
            echo "== $apk"
            "$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
            # A debug-signed APK would mean the keystore secret never got picked up.
            if grep -qi "CN=Android Debug" /tmp/certs.txt; then
              echo "::error::$apk is signed with the debug key, not the release key"
              exit 1
            fi
          done

      # Binds every artifact to this exact commit, workflow and runner, signed
      # through Sigstore. Anyone can check a download against the source with:
      #   gh attestation verify <file>.apk -R ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*.apk'

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ## Install

            Grab **`anipocket-${{ steps.version.outputs.name }}-arm64-v8a.apk`** — that is
            the right build for essentially every phone made in the last decade. Take the
            `universal` one if you are not sure; it is bigger but runs everywhere.

            Android will ask you to allow installing from an unknown source. There is no
            Play Store build: the app has no accounts and no server, and nothing to sell.

            ## Verify what you downloaded

            Every APK here is signed with the project release key **and** carries a
            Sigstore provenance attestation binding it to commit
            [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            and to the workflow run that produced it. Nothing was built or uploaded by hand.

            ```bash
            # the build really came from this repository, at this commit
            gh attestation verify anipocket-${{ steps.version.outputs.name }}-arm64-v8a.apk \
              -R ${{ github.repository }}

            # the bytes match what the workflow published
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
