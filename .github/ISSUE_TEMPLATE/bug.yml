name: Bug report
description: Something in the app misbehaves
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 7, Android 15

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: v1.0.0

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`adb logcat -s flutter` around the moment it broke, if you can get them."
      render: shell
